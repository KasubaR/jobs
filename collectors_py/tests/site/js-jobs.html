<!doctype html>
<html><head><meta charset="utf-8"><title>Jobs (built by JavaScript)</title></head><body>
<h1>Vacancies</h1>
<div id="app">Loading vacancies...</div>
<script>
  setTimeout(function () {
    var jobs = [["/jobs/1.html", "Budget Analyst at Example Charity"], ["/jobs/2.html", "Driver at Sample Mining"]];
    var ul = document.createElement("ul");
    ul.className = "job-list";
    jobs.forEach(function (j) {
      var li = document.createElement("li"); li.className = "job";
      var a = document.createElement("a"); a.href = j[0]; a.textContent = j[1];
      li.appendChild(a); ul.appendChild(li);
    });
    document.getElementById("app").replaceChildren(ul);
  }, 150);
</script>
</body></html>
